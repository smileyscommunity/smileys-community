<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 320" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Smileys Cup 2026 hero banner">
  <defs>
    <!-- Amber gradient matching the brand palette in tailwind.config.js
         (brand.400 → brand.600 → brand.700 stops). -->
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"  stop-color="#fbbf24"/>
      <stop offset="55%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
    <radialGradient id="spot" cx="0.78" cy="0.18" r="0.6">
      <stop offset="0%"  stop-color="#fef3c7" stop-opacity="0.55"/>
      <stop offset="60%" stop-color="#fef3c7" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="trophy" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"  stop-color="#fef3c7"/>
      <stop offset="100%" stop-color="#fcd34d"/>
    </linearGradient>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.4" fill="#fef3c7" opacity="0.18"/>
    </pattern>
  </defs>

  <!-- Background gradient + soft sun spot top-right + dot texture. -->
  <rect width="800" height="320" fill="url(#bg)"/>
  <rect width="800" height="320" fill="url(#spot)"/>
  <rect width="800" height="320" fill="url(#dots)"/>

  <!-- Stadium silhouette along the bottom. Cropped at lg+ aspect-[4/1]
       (visible band ends at y=260) but that's fine — it reads as
       horizon depth at narrower aspect ratios. -->
  <path d="M0 280 Q200 250 400 270 T800 260 L800 320 L0 320 Z" fill="#92400e" opacity="0.42"/>
  <path d="M0 295 Q200 270 400 285 T800 280 L800 320 L0 320 Z" fill="#78350f" opacity="0.55"/>

  <!-- Floor shadow under the trophy. Repositioned to sit beneath the
       new trophy at translate(60 70) scale(0.85). -->
  <ellipse cx="145" cy="252" rx="85" ry="7" fill="#78350f" opacity="0.32"/>

  <!-- Trophy cup. Shrunk to 0.85× and shifted left so the title block
       on the right has comfortable horizontal margin (the earlier
       single-line fs=46 title was clipping "2026" at the viewBox
       edge — fs=60 needs ~486 viewBox units which the original
       trophy at translate(160 60) didn't leave). Stacked shapes drawn
       in pixel-style geometry so the silhouette stays crisp at any
       scale. -->
  <g transform="translate(60 70) scale(0.85)">
    <!-- Left handle -->
    <path d="M22 60 Q-6 60 -6 96 Q-6 134 28 134"
          fill="none" stroke="url(#trophy)" stroke-width="14" stroke-linecap="round"/>
    <!-- Right handle -->
    <path d="M178 60 Q206 60 206 96 Q206 134 172 134"
          fill="none" stroke="url(#trophy)" stroke-width="14" stroke-linecap="round"/>
    <!-- Cup body -->
    <path d="M22 30 L178 30 L170 138 Q165 168 100 168 Q35 168 30 138 Z"
          fill="url(#trophy)" stroke="#fef3c7" stroke-width="2"/>
    <!-- Cup rim highlight -->
    <rect x="22" y="22" width="156" height="16" rx="3" fill="#fef9c3" stroke="#fef3c7" stroke-width="2"/>
    <!-- Star in the middle -->
    <path d="M100 76 L108 96 L130 96 L112 110 L120 130 L100 118 L80 130 L88 110 L70 96 L92 96 Z"
          fill="#b45309" opacity="0.42"/>
    <!-- Stem -->
    <rect x="86" y="168" width="28" height="14" fill="#fcd34d"/>
    <!-- Base -->
    <rect x="60" y="180" width="80" height="14" rx="3" fill="#fef3c7"/>
    <rect x="48" y="194" width="104" height="22" rx="4" fill="#fcd34d" stroke="#b45309" stroke-width="1.5" opacity="0.85"/>
  </g>

  <!-- Text block right of the trophy. Single-line "WORLD CUP 2026" at
       fs=60 starting at x=270 gives a rendered width of ~486 viewBox
       units (right edge ~x=756) — 44 units of margin to the viewBox
       edge, comfortably clear of any font-substitution width drift.
       SMILEYS overline + date tagline keep the three-line vertical
       structure so the block stays balanced inside the visible band
       (y≈93–225 → center y=159, matches the y=160 band center at
       aspect-[4/1] crop). -->
  <g transform="translate(270 110)" font-family="'Plus Jakarta Sans', Inter, system-ui, sans-serif">
    <text x="0" y="0" fill="#fef3c7" font-size="22" font-weight="800" letter-spacing="0.18em" opacity="0.95">SMILEYS</text>
    <text x="0" y="68" fill="#ffffff" font-size="60" font-weight="900" letter-spacing="-0.02em">WORLD CUP 2026</text>
    <text x="0" y="112" fill="#fef3c7" font-size="18" font-weight="700" letter-spacing="0.04em" opacity="0.95">Jun 11 → Jul 19 · Predict every match</text>
  </g>

  <!-- Confetti. Reduced from the original set and repositioned away
       from the new title block. The old top-left cluster around x=120
       y=22 sat under the bigger overline and got trimmed at narrower
       aspect ratios; the kept pieces are above the trophy and far
       right where they decorate without competing with the title. -->
  <g opacity="0.85">
    <rect x="60"  y="42"  width="8" height="4" rx="1" fill="#fef3c7" transform="rotate(28 64 44)"/>
    <rect x="180" y="36"  width="8" height="4" rx="1" fill="#fde68a" transform="rotate(-14 184 38)"/>
    <rect x="700" y="68"  width="10" height="4" rx="1" fill="#fef3c7" transform="rotate(18 705 70)"/>
    <rect x="744" y="42"  width="8" height="4" rx="1" fill="#fde68a" transform="rotate(-30 748 44)"/>
    <rect x="720" y="116" width="6" height="3" rx="1" fill="#fff7ed" transform="rotate(60 723 118)"/>
  </g>
</svg>
